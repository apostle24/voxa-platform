# Run from the repository root after setting LiveKit and OpenAI credentials in .env.
services:
  voxa-live-captions-agent:
    build:
      context: ..
      dockerfile: apps/live-agent/Dockerfile
    image: voxa-live-captions-agent:local
    init: true
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      VOXA_LIVE_CAPTIONS_AGENT_NAME: ${VOXA_LIVE_CAPTIONS_AGENT_NAME:-voxa-live-captions}
      VOXA_LIVE_STT_MODEL: ${VOXA_LIVE_STT_MODEL:-gpt-4o-mini-transcribe}
      VOXA_LIVE_CAPTIONS_LANGUAGE: ${VOXA_LIVE_CAPTIONS_LANGUAGE:-en}
      VOXA_LIVE_CAPTIONS_MAX_PARTICIPANTS: ${VOXA_LIVE_CAPTIONS_MAX_PARTICIPANTS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    stop_grace_period: 45s
