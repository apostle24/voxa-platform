name: API CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - "infra/media-worker.compose.yml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - "infra/media-worker.compose.yml"
      - ".github/workflows/api-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @voxa/api exec prisma validate
        env:
          DATABASE_URL: postgresql://voxa:voxa@localhost:5432/voxa_ci
      - run: pnpm --filter @voxa/api prisma:generate
      - name: Check media worker syntax
        run: node --check apps/api/scripts/media-worker.cjs
      - name: Build isolated media worker image
        run: docker build -f apps/api/Dockerfile.media-worker -t voxa-media-worker:ci .
      - name: Typecheck API and web
        run: pnpm -r typecheck
      - name: Run API unit tests
        run: pnpm --filter @voxa/api test
      - run: pnpm --filter @voxa/api build
      - run: pnpm --filter @voxa/web build
