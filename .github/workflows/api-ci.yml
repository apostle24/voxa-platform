name: API CI

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install workspace dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Generate dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Commit first generated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: commit pnpm lockfile [skip ci]"
          git push
      - name: Validate Prisma schema
        run: pnpm --filter @voxa/api exec prisma validate
        env:
          DATABASE_URL: postgresql://voxa:voxa@localhost:5432/voxa_ci
      - run: pnpm --filter @voxa/api prisma:generate
      - name: Typecheck API and web
        run: pnpm -r typecheck
      - name: Run API unit tests
        run: pnpm --filter @voxa/api test
      - run: pnpm --filter @voxa/api build
      - run: pnpm --filter @voxa/web build
