name: API CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/api-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Generate dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Validate Prisma schema
        run: pnpm --filter @voxa/api exec prisma validate
        env:
          DATABASE_URL: postgresql://voxa:voxa@localhost:5432/voxa_ci
      - run: pnpm --filter @voxa/api prisma:generate
      - name: Typecheck API and web
        run: pnpm -r typecheck
      - name: Run API unit tests
        run: pnpm --filter @voxa/api test
      - run: pnpm --filter @voxa/api build
      - run: pnpm --filter @voxa/web build
