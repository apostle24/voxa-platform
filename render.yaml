projects:
  - name: VOXA
    environments:
      - name: staging
        services:
          - type: web
            name: voxa-staging-api
            runtime: node
            region: frankfurt
            plan: free
            branch: deploy/voxa-staging-render
            buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @voxa/api prisma:generate && pnpm --filter @voxa/api build
            startCommand: pnpm --filter @voxa/api exec prisma migrate deploy && node apps/api/dist/main.js
            healthCheckPath: /v1/health/ready
            envVars:
              - key: NODE_ENV
                value: production
              - key: DATABASE_URL
                fromDatabase:
                  name: voxa-staging-db
                  property: connectionString
              - key: JWT_SECRET
                generateValue: true
              - key: CORS_ORIGINS
                value: https://voxa-staging-web-1ktg.onrender.com
              - key: FRONTEND_URL
                value: https://voxa-staging-web-1ktg.onrender.com
              - key: PAYSTACK_TRANSFERS_ENABLED
                value: "false"
              - key: PAYSTACK_PAYOUT_EXECUTION_ENABLED
                value: "false"
              - key: SETTLEMENT_WORKER_ENABLED
                value: "false"
              - key: LIVEKIT_CAPTIONS_AGENT_ENABLED
                value: "false"
          - type: web
            name: voxa-staging-web
            runtime: node
            region: frankfurt
            plan: free
            branch: deploy/voxa-staging-render
            buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @voxa/web build
            startCommand: pnpm --filter @voxa/web start
            envVars:
              - key: NEXT_PUBLIC_VOXA_API_URL
                value: https://voxa-staging-api-1ktg.onrender.com/v1
        databases:
          - name: voxa-staging-db
            databaseName: voxa_staging
            plan: free
            region: frankfurt
